name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: ./node_modules/.bin/expo export --platform web
      # GitHub Pages serves this repo at /owly/, but Expo emits
      # domain-root asset paths (/_expo/...). Prefix them so the
      # app actually loads.
      - name: Fix asset paths for /owly/ subpath
        run: |
          find dist -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i 's|"\/_expo\/|"/owly/_expo/|g' {} +
      # SPA fallback: GitHub Pages serves 404.html for any path that
      # isn't a static file, so deep links (/owly/home, /owly/summary)
      # load the app and let Expo Router handle the route.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
